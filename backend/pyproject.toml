[project]
name = "work-location-tracker-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "alembic>=1.13.0",
    # The backend optionally serves the Flet web UI from the same instance
    # (see backend.main._mount_frontend). flet.fastapi requires the flet-web
    # runtime, which ships only via the `web` extra — a plain `flet` dependency
    # does not install it, so production `uv sync --no-dev` would otherwise fail
    # at import with `ModuleNotFoundError: No module named 'flet_web'`.
    "flet[web]>=1.0.0",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "hypothesis>=6.115.0",
    "ruff>=0.7.0",
    "aiosqlite>=0.22.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
